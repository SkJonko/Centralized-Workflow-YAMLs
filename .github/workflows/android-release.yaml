name: Build Android Release

on:
  workflow_call:
    inputs:
      project_path:
        required: true
        type: string
        default: 'src/myApp/myApp.csproj'
      version_name:
        description: 'Version name (e.g. 1.0) the last integer will be automatically incremented based on the pipeline build number'
        required: true
        type: string
        default: '1.0'
      release_title:
        required: false
        type: string
        default: 'MyApp Release'
      create_github_release:
        description: 'Whether to create a GitHub release'
        required: false
        type: boolean
        default: true
      dotnet_version:
        required: false
        type: string
        default: '10.0.x'
    secrets:
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEYSTORE_BASE64:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Setup .NET ${{ inputs.dotnet_version }}
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore NuGet packages
        run: dotnet restore ${{ inputs.project_path }} -p:TargetFramework=net10.0-android36.0

      - name: Decode Keystore
        run: |
          echo "Decoding keystore from base64..."
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > myapp.keystore

          if [ ! -s myapp.keystore ]; then
            echo "ERROR: Keystore file was not created or is empty."
            exit 1
          fi

          # Verify keystore integrity
          keytool -list -v -keystore myapp.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "ERROR: Keystore verification failed. Check your keystore credentials."
            exit 1
          fi

          keystore_size=$(stat --format=%s myapp.keystore)
          keystore_hash=$(sha256sum myapp.keystore | cut -d' ' -f1)
          echo "✓ Keystore decoded successfully (size: $keystore_size bytes)"
          echo "✓ Keystore SHA256: $keystore_hash"
          echo "✓ Keystore verified - key alias and credentials are correct"

      - name: Set version variables
        run: |
          buildNumber=${{ github.run_number }}
          version="${{ inputs.version_name }}"

          versionCode=$((10000 + buildNumber))

          echo "Build Number: $buildNumber"
          echo "Version: $version"
          echo "Version Code: $versionCode"

          echo "VERSION_DISPLAY=${version}.${buildNumber}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${versionCode}" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: |
          # Verify keystore file exists
          if [ ! -f myapp.keystore ]; then
            echo "ERROR: Keystore file not found at myapp.keystore"
            ls -la *.keystore 2>/dev/null || echo "No keystore files found in current directory"
            exit 1
          fi
          
          KEYSTORE_PATH="$(pwd)/myapp.keystore"
          echo "✓ Keystore file verified at: $KEYSTORE_PATH"
          echo "✓ Keystore file size: $(stat --format=%s myapp.keystore) bytes"

          dotnet publish ${{ inputs.project_path }} \
            -f net10.0-android36.0 \
            -c Release \
            -p:TargetFrameworks=net10.0-android36.0 \
            -p:AndroidSigningKeyAlias="${{ secrets.KEY_ALIAS }}" \
            -p:AndroidSigningKeyPass="${{ secrets.KEY_PASSWORD }}" \
            -p:AndroidSigningStorePass="${{ secrets.KEYSTORE_PASSWORD }}" \
            -p:ApplicationVersion="${VERSION_CODE}" \
            -p:AndroidSigningStore="$KEYSTORE_PATH" \
            -p:ApplicationDisplayVersion="${VERSION_DISPLAY}"

      - name: Find artifacts
        id: find_artifacts
        run: |
          APK_PATH=$(find "${{ github.workspace }}" -name "*-Signed.apk" -not -path "*/obj/*" | head -1)
          AAB_PATH=$(find "${{ github.workspace }}" -name "*.aab" -not -path "*/obj/*" | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No signed APK found!"
            echo "Looking for any APK files..."
            find "${{ github.workspace }}" -name "*.apk" -type f | head -10
            exit 1
          fi
          
          # Verify APK is signed
          echo "Verifying APK signature..."
          jarsigner -verify -verbose "$APK_PATH" > /tmp/signature_info.txt 2>&1
          cat /tmp/signature_info.txt
          
          if ! grep -q "jar verified" /tmp/signature_info.txt; then
            echo "⚠️ WARNING: APK signature verification failed or APK is not signed!"
            exit 1
          fi
          
          # Get APK hash for comparison
          echo "APK SHA256: $(sha256sum "$APK_PATH")"
          
          echo "apk=$APK_PATH" >> $GITHUB_OUTPUT
          echo "aab=$AAB_PATH" >> $GITHUB_OUTPUT
          echo "✓ Found APK: $APK_PATH"
          echo "✓ Found AAB: $AAB_PATH"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-${{ env.VERSION_DISPLAY }}
          path: |
            ${{ steps.find_artifacts.outputs.apk }}
            ${{ steps.find_artifacts.outputs.aab }}
          if-no-files-found: error
          retention-days: 10

      - name: Create GitHub Release
        if: inputs.create_github_release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: v${{ env.VERSION_DISPLAY }}
          name: ${{ inputs.release_title }} (v${{ env.VERSION_DISPLAY }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.find_artifacts.outputs.apk }}
            ${{ steps.find_artifacts.outputs.aab }}

      - name: Clean up keystore
        if: always()
        run: |
          rm -f myapp.keystore